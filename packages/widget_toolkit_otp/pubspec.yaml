name: widget_toolkit_otp
description: Package helping with building sms or pin code fields and screens in a matter of minutes
version: 0.1.3
homepage: https://primeholding.com/

environment:
  sdk: ">=3.0.5 <4.0.0"
  flutter: ">=3.10.5"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_rx_bloc: ^7.0.0
  pinput: ^6.0.2
  provider: ^6.1.5
  rx_bloc: ^6.0.1
  rxdart: ^0.28.0
  smart_auth: ^3.2.0
  theme_tailor_annotation: ^3.1.3
  widget_toolkit: ^0.2.0

dev_dependencies:
  build_runner: ^2.15.0
  clean_coverage: ^0.0.3
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  golden_toolkit: ^0.15.0
  mockito: ^5.6.4
  rx_bloc_generator: ^9.0.0
  rx_bloc_test: ^5.0.0
  theme_tailor: ^3.1.3

flutter:
  uses-material-design: true

screenshots:
  - description: "SMS OTP Field"
    path: doc/assets/otp-example.webp
