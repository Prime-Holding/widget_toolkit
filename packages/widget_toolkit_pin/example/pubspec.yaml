name: example
description: An example project to present how to use widget_toolkit_pin package with minimal effort.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ">=3.0.5 <4.0.0"

dependencies:
  shared_preferences: ^2.5.5
  flutter:
    sdk: flutter
  flutter_rx_bloc: ^7.0.0
  provider: ^6.1.5
  rx_bloc: ^6.0.1
  widget_toolkit: ^0.2.0
  widget_toolkit_pin: ^0.3.0
  widget_toolkit_biometrics: ^0.1.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  build_runner: ^2.15.0

flutter:
  uses-material-design: true
