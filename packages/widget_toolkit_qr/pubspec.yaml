name: widget_toolkit_qr
description: A Flutter package which provides a QR scanner widget easy integrated into the application.
version: 0.2.2
repository: https://github.com/Prime-Holding/widget_toolkit/tree/master/packages/widget_toolkit_qr
issue_tracker: https://github.com/orgs/Prime-Holding/projects/6
homepage: https://primeholding.com/

environment:
  sdk: ">=3.0.5 <4.0.0"
  flutter: ">=3.10.5"

dependencies:
  app_settings: ^7.0.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_rx_bloc: ^7.0.0
  flutter_svg: ^2.3.0
  mobile_scanner: ^7.2.0
  permission_handler: ^12.0.1
  provider: ^6.1.5
  rx_bloc: ^6.0.1
  rxdart: ^0.28.0
  theme_tailor_annotation: ^3.1.3
  widget_toolkit: ^0.2.0

dev_dependencies:
  build_runner: ^2.15.0
  clean_coverage: ^0.0.3
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  golden_toolkit: ^0.15.0
  mockito: ^5.6.4
  rx_bloc_generator: ^9.0.0
  rx_bloc_test: ^5.0.0
  theme_tailor: ^3.1.3

flutter:
  uses-material-design: true

  assets:
    - packages/widget_toolkit_qr/icons/qr-scan-area.svg

screenshots:
  - description: "QR Widget (Permission Asked)"
    path: doc/assets/permission_asked.webp
  - description: "QR Widget (Error State)"
    path: doc/assets/scan_error.webp
  - description: "QR Widget (Success Asked)"
    path: doc/assets/scan_success.webp
